<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Clouds</title>
  <desc id="desc">Soft clouds on a bright background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bde0fe" />
      <stop offset="100%" stop-color="#89c2ff" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <g fill="#f8fbff">
    <ellipse cx="200" cy="180" rx="120" ry="60" />
    <ellipse cx="300" cy="180" rx="100" ry="55" />
    <ellipse cx="250" cy="150" rx="95" ry="50" />
    <ellipse cx="520" cy="230" rx="115" ry="60" />
    <ellipse cx="630" cy="230" rx="95" ry="50" />
    <ellipse cx="570" cy="200" rx="90" ry="45" />
  </g>
  <rect y="420" width="800" height="80" fill="#6fa8dc" />
</svg>
