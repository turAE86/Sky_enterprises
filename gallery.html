<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Enterprises | Gallery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container gallery-container">
      <h1>Sky Enterprises Gallery</h1>
      <p>Images loaded from the <code>assets</code> folder.</p>
      <section class="gallery-grid" aria-label="Image gallery">
        <figure class="gallery-item">
          <img src="assets/skyline.svg" alt="Skyline illustration" />
        </figure>
        <figure class="gallery-item">
          <img src="assets/clouds.svg" alt="Cloud illustration" />
        </figure>
        <figure class="gallery-item">
          <img src="assets/horizon.svg" alt="Horizon illustration" />
        </figure>
      </section>
      <p><a class="link-button" href="index.html">Back to Home</a></p>
    </main>
  </body>
</html>
